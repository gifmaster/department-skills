department: it
title: IT
prefix: it
role: a pragmatic IT manager and information security lead
overview: >-
  Skills for IT operations, service management, security, risk, compliance, architecture,
  vendor management and AI governance. Built for small IT teams and managed-service customers
  who must run reliable systems and meet NIS2, GDPR and AI Act expectations.
workflows:
  - name: Incident to improvement
    skills: [incident-triage, phishing-triage, incident-postmortem, runbook-writer]
    purpose: Handle incidents calmly, learn from them and write it down.
  - name: Security and compliance baseline
    skills: [nis2-readiness, security-policy-drafter, risk-assessment, access-review, backup-dr-plan, vendor-security-review]
    purpose: A proportionate security programme that will stand up to customers and regulators.
  - name: Change and delivery
    skills: [requirements-user-stories, solution-evaluation, architecture-decision-record, change-request, project-status-report]
    purpose: From business need to a controlled change.
common_guardrails:
  - Never ask for or repeat passwords, secret keys, tokens or full configuration secrets. Tell the user to redact them before sharing logs or files.
  - For live security incidents, recommend involving the responsible incident lead and, where relevant, external incident response support, the police or national CSIRT. Do not advise actions that destroy evidence.
  - Commands and scripts are suggestions to test first in a non-production environment. Explain what each does before the user runs it.
common_eu:
  - "NIS2 (Directive (EU) 2022/2555) sets cybersecurity risk management and incident reporting duties for essential and important entities. Denmark's NIS2 law applies from 1 July 2025, with sector authorities supervising and reports going to the national CSIRT; check your sector's rules."
  - "GDPR Article 32 requires appropriate security of processing; the AI Act adds duties for organisations that build or use AI systems; DORA applies to financial entities and their critical ICT providers."
skills:
  - id: incident-triage
    title: IT Incident Triage
    summary: Triages an IT incident or outage, assesses severity and impact, guides diagnosis and drafts status updates for users and management.
    triggers: something is down or broken, there is an outage, a system is slow, or the user needs incident severity and communications
    use:
      - "Live incidents"
      - "Major incident drills"
    avoid:
      - "Data breach legal assessment (pair with legal-data-breach-response)"
    inputs:
      - "Symptoms and when they started"
      - "Affected systems and users"
      - "Recent changes"
      - "Logs or error messages (redacted)"
    steps:
      - Assess severity by impact and urgency and name an incident lead.
      - Check recent changes and known dependencies first.
      - Propose a diagnostic plan from least to most disruptive.
      - Decide on workaround or rollback options.
      - Draft status updates at a fixed rhythm and assess whether security or personal data are involved.
    output:
      - "Severity and impact"
      - "Timeline so far"
      - "Diagnostic plan"
      - "Workaround or rollback options"
      - "Status update drafts"
      - "Escalation and reporting check"
    checks:
      - "Possible security incident considered"
      - "Regulatory reporting clocks identified"
    eu: ["NIS2 entities must send an early warning within 24 hours of becoming aware of a significant incident, a notification within 72 hours and a final report within one month."]
    examples:
      - "Email is down for half the company since 9:15. Help me run this incident."

  - id: incident-postmortem
    title: Blameless Postmortem
    summary: Writes a blameless postmortem with timeline, impact, root causes, contributing factors and tracked actions.
    triggers: an incident is resolved and the user needs a postmortem, root cause analysis, incident report or lessons learned
    use:
      - "After major incidents"
      - "Customer-facing incident reports"
    avoid: []
    inputs:
      - "Incident timeline and chat logs"
      - "Impact data"
      - "Fixes applied"
    steps:
      - Build an accurate timeline from detection to resolution.
      - Quantify impact (duration, users, transactions, money).
      - Analyse causes with 5 whys or a fishbone, focusing on systems, not people.
      - Identify what went well and what was lucky.
      - Define corrective actions with owners and dates.
    output:
      - "Summary"
      - "Impact"
      - "Timeline"
      - "Root causes and contributing factors"
      - "What went well"
      - "Actions"
    checks:
      - "No blame on individuals"
      - "Actions are specific and tracked"
    eu: []
    examples:
      - "Write the postmortem for yesterday's 3-hour ERP outage from this Teams chat."

  - id: change-request
    title: Change Request
    summary: Writes a change request for the change advisory board with description, risk, test plan, rollback, communication and schedule.
    triggers: the user needs a change request, RFC, CAB submission or wants to plan a production change safely
    use:
      - "Normal and major changes"
    avoid: []
    inputs:
      - "What will change and why"
      - "Systems affected"
      - "Planned window"
      - "Test results"
    steps:
      - Describe the change and business reason.
      - Assess risk and impact, including dependencies.
      - Write implementation, test and rollback plans.
      - Plan communication to users and stakeholders.
    output:
      - "Change summary"
      - "Risk and impact"
      - "Implementation plan"
      - "Test plan"
      - "Rollback plan"
      - "Communication"
      - "Approval"
    checks:
      - "Rollback is tested or feasible"
      - "Window avoids business-critical periods"
    eu: []
    examples:
      - "Write a change request for upgrading our firewall firmware next Saturday."

  - id: runbook-writer
    title: Runbook Writer
    summary: Writes clear operational runbooks and standard operating procedures with prerequisites, steps, checks and escalation.
    triggers: the user needs a runbook, SOP, procedure, playbook or operating instructions for an IT task
    use:
      - "Repeated operational tasks"
      - "On-call handovers"
    avoid: []
    inputs:
      - "Task and system"
      - "Current way it is done"
      - "Who will use the runbook"
    steps:
      - Define purpose, scope, prerequisites and access needed.
      - Write numbered steps with expected results.
      - Add verification checks and troubleshooting branches.
      - Add escalation contacts and revision history.
    output:
      - "Purpose and scope"
      - "Prerequisites"
      - "Steps"
      - "Verification"
      - "Troubleshooting"
      - "Escalation"
    checks:
      - "Steps can be followed by someone new"
      - "No secrets in the document"
    eu: []
    examples:
      - "Write a runbook for restoring a user's OneDrive from backup."

  - id: helpdesk-knowledge-article
    title: Helpdesk Reply and Knowledge Article
    summary: Drafts helpdesk ticket replies and turns recurring fixes into self-service knowledge articles for end users.
    triggers: the user needs to answer an IT support ticket, write a how-to for staff or build an IT knowledge base article
    use:
      - "Recurring tickets"
      - "Self-service portal content"
    avoid: []
    inputs:
      - "Ticket or question"
      - "Known fix or steps"
      - "User's technical level"
    steps:
      - Reply with empathy, the fix in numbered steps and what to do if it fails.
      - Turn recurring fixes into an article with symptoms, cause, solution and screenshots to add.
      - Tag the article for search.
    output:
      - "Ticket reply"
      - "Knowledge article"
      - "Tags"
    checks:
      - "Steps match the user's version of the software"
      - "Plain language"
    eu: []
    examples:
      - "Write a KB article on setting up MFA with Microsoft Authenticator for staff."

  - id: access-review
    title: Access Review and Joiner-Mover-Leaver
    summary: Runs a user access review and joiner, mover and leaver process to enforce least privilege across systems.
    triggers: the user needs an access review, user recertification, offboarding of accounts, privileged access review or JML process
    use:
      - "Quarterly access reviews"
      - "After reorganisations"
      - "Audit requirements"
    avoid: []
    inputs:
      - "User and role exports from key systems"
      - "HR list of active employees and roles"
      - "Role definitions"
    steps:
      - Match accounts to HR records and find orphaned or shared accounts.
      - Compare access with role definitions and flag excess rights.
      - Review privileged and admin access separately.
      - Produce manager attestation lists and removal actions.
    output:
      - "Orphaned accounts"
      - "Excess access"
      - "Privileged access findings"
      - "Attestation lists"
      - "JML process improvements"
    checks:
      - "Leavers removed on last day"
      - "Admin accounts separate from daily accounts"
    eu: []
    examples:
      - "Review access in Microsoft 365 and our ERP against this HR list."

  - id: security-policy-drafter
    title: Information Security Policy Drafter
    summary: Drafts information security policies and standards aligned with ISO 27001 and NIS2, proportionate to the organisation's size.
    triggers: the user needs an information security policy, acceptable use policy, password policy, ISMS documents or ISO 27001 policies
    use:
      - "Building an ISMS"
      - "Customer security requirements"
    avoid: []
    inputs:
      - "Organisation size and IT setup"
      - "Frameworks to align with"
      - "Existing policies"
    steps:
      - Draft the top-level policy with scope, roles and commitment.
      - Draft topic policies needed (access, acceptable use, backup, incident, supplier, cryptography).
      - Map policies to ISO 27001 Annex A controls and NIS2 Article 21 measures.
      - Add review cycle and approval.
    output:
      - "Policy set"
      - "Control mapping"
      - "Implementation notes"
    checks:
      - "Policies are realistic for the team"
      - "Roles and owners named"
    eu: []
    examples:
      - "Write an information security policy set for a 50-person company on Microsoft 365."

  - id: risk-assessment
    title: IT and Cyber Risk Assessment
    summary: Performs an IT and cyber risk assessment with asset inventory, threats, vulnerabilities, risk ratings and a treatment plan.
    triggers: the user needs a risk assessment, cyber risk register, ISO 27005 style assessment or NIS2 risk analysis
    use:
      - "Annual risk review"
      - "New systems"
      - "NIS2 compliance"
    avoid: []
    inputs:
      - "Key assets and processes"
      - "Known threats and incidents"
      - "Existing controls"
    steps:
      - List critical assets and their owners.
      - Identify threats and vulnerabilities per asset.
      - Rate likelihood and impact on a defined scale.
      - Propose treatment (reduce, avoid, transfer, accept) and residual risk.
    output:
      - "Asset list"
      - "Risk register"
      - "Heat map summary"
      - "Treatment plan"
    checks:
      - "Rating scale defined"
      - "Risk owners are business people, not only IT"
    eu: []
    examples:
      - "Do a cyber risk assessment for our webshop and warehouse systems."

  - id: nis2-readiness
    title: NIS2 Readiness Assessment
    summary: Checks whether NIS2 applies, maps the Article 21 security measures and reporting duties, and produces a gap analysis and roadmap.
    triggers: the user asks if NIS2 applies, wants a NIS2 gap analysis, cybersecurity compliance roadmap or management body training needs
    use:
      - "Medium and large companies in NIS2 sectors"
      - "Suppliers to NIS2 entities"
    avoid: []
    inputs:
      - "Sector, size (employees, turnover, balance sheet) and countries"
      - "Current security measures"
      - "Group structure"
    steps:
      - Assess scope (sector annex, size thresholds, special cases) and essential or important status.
      - Map the Article 21 minimum measures to current controls.
      - Check incident reporting readiness and management body duties (approval, oversight, training).
      - Produce a gap analysis and a prioritised roadmap.
    output:
      - "Scope assessment"
      - "Gap analysis by measure"
      - "Reporting readiness"
      - "Management duties"
      - "Roadmap"
    checks:
      - "National transposition checked"
      - "Supply chain security included"
    eu: []
    examples:
      - "We are a 120-person food producer in Denmark. Does NIS2 apply and what do we need?"

  - id: vendor-security-review
    title: Vendor Security Review
    summary: Reviews a vendor's security posture from questionnaires, certifications and documents, and answers incoming security questionnaires.
    triggers: the user needs to assess an IT vendor, send or answer a security questionnaire, review SOC 2 or ISO 27001 reports
    use:
      - "Buying SaaS"
      - "Customer security questionnaires"
    avoid: []
    inputs:
      - "Vendor documents (certificates, SOC 2 report, policies)"
      - "Data and access the vendor will have"
      - "Questionnaire to answer if incoming"
    steps:
      - Tier the vendor by data sensitivity and criticality.
      - Review certificates for scope and dates, and SOC 2 exceptions.
      - Check key controls (MFA, encryption, logging, backup, sub-processors, data location).
      - Summarise risk and contract requirements.
      - For incoming questionnaires, draft answers from the user's policies only.
    output:
      - "Vendor tier"
      - "Findings"
      - "Risk rating"
      - "Contract requirements"
      - "Draft questionnaire answers"
    checks:
      - "Certificate scope covers the service bought"
      - "Answers do not overstate controls"
    eu: []
    examples:
      - "Review this SOC 2 report from our new HR system vendor."

  - id: phishing-triage
    title: Phishing Email Triage
    summary: Analyses a suspicious email for phishing indicators, decides on response actions and drafts a warning to staff.
    triggers: the user received a suspicious email, phishing attempt, CEO fraud or invoice fraud attempt
    use:
      - "Reported suspicious emails"
      - "Security awareness"
    avoid:
      - "Clicking links or opening attachments"
    inputs:
      - "Email headers and body (with links defanged)"
      - "What the recipient did"
    steps:
      - Check sender, headers, links, attachments and language for indicators.
      - Classify as phishing, spam, legitimate or unsure.
      - If someone clicked or entered credentials, list containment steps (reset, revoke sessions, check rules and sign-ins).
      - Draft a short staff warning if needed.
    output:
      - "Verdict and indicators"
      - "Containment actions"
      - "Staff warning"
    checks:
      - "Credential compromise steps include checking mailbox forwarding rules"
      - "No live links reproduced"
    eu: []
    examples:
      - "Is this email from our CEO asking for gift cards real? Two people replied."

  - id: backup-dr-plan
    title: Backup and Disaster Recovery Plan
    summary: Designs backup and disaster recovery with recovery objectives, the 3-2-1 approach, restore testing and an IT continuity plan.
    triggers: the user needs a backup strategy, disaster recovery plan, ransomware recovery plan or RTO and RPO definitions
    use:
      - "No tested backup plan"
      - "Ransomware readiness"
      - "Audit findings"
    avoid: []
    inputs:
      - "Systems and data"
      - "Business tolerance for downtime and data loss"
      - "Current backup setup including SaaS"
    steps:
      - Agree RTO and RPO per system with the business.
      - Design backups with offline or immutable copies.
      - Include SaaS data such as Microsoft 365.
      - Write recovery procedures and a test schedule.
    output:
      - "System criticality and objectives"
      - "Backup design"
      - "Recovery procedures"
      - "Test plan"
      - "Gaps"
    checks:
      - "Restores are tested, not assumed"
      - "Backups protected from the same admin accounts"
    eu: []
    examples:
      - "Design backup and recovery for our 3 servers and Microsoft 365."

  - id: solution-evaluation
    title: Software Evaluation and Build versus Buy
    summary: Evaluates software options or build versus buy with requirements, weighted scoring, total cost, risks and a recommendation.
    triggers: the user is choosing software, comparing tools, deciding build versus buy or running a software selection
    use:
      - "New systems"
      - "Replacing legacy tools"
    avoid: []
    inputs:
      - "Business requirements"
      - "Shortlisted options"
      - "Budget and constraints"
    steps:
      - Prioritise requirements with MoSCoW.
      - Score options with evidence and demos.
      - Calculate 3 to 5 year total cost of ownership.
      - Assess risks (vendor, security, data location, lock-in, AI features).
      - Recommend with a decision summary.
    output:
      - "Requirements"
      - "Scoring matrix"
      - "TCO"
      - "Risks"
      - "Recommendation"
    checks:
      - "Exit and data portability considered"
      - "Same scope across options"
    eu: ["The EU Data Act includes cloud switching rights and limits on switching charges for data processing services."]
    examples:
      - "Compare three ticketing systems for a 15-person IT team."

  - id: architecture-decision-record
    title: Architecture Decision Record
    summary: Documents an architecture or technology decision as an ADR with context, options, decision, consequences and status.
    triggers: the user is making or documenting a technical decision, architecture choice or design trade-off
    use:
      - "Significant technical choices"
      - "Onboarding new team members to past decisions"
    avoid: []
    inputs:
      - "The decision to make"
      - "Context and constraints"
      - "Options considered"
    steps:
      - Describe the context and forces.
      - Compare options with pros and cons.
      - State the decision and the reasons.
      - Record consequences, risks and follow-ups.
    output:
      - "Title and status"
      - "Context"
      - "Options"
      - "Decision"
      - "Consequences"
    checks:
      - "Options are fairly described"
      - "Decision is traceable to constraints"
    eu: []
    examples:
      - "Write an ADR for moving our file server to SharePoint."

  - id: asset-licence-review
    title: IT Asset and Licence Review
    summary: Reviews IT assets and software licences to find unused, duplicate or non-compliant licences and lifecycle risks.
    triggers: the user wants a licence review, software asset management, SaaS cost cleanup or hardware lifecycle plan
    use:
      - "Renewal season"
      - "Cost cutting"
      - "Audit preparation"
    avoid: []
    inputs:
      - "Licence and subscription list with costs"
      - "Usage data"
      - "Asset inventory"
    steps:
      - Reconcile licences with active users and usage.
      - Find unused, duplicated and over-specified licences.
      - Check licence compliance risks.
      - Plan hardware refresh for end-of-life devices.
    output:
      - "Licence position"
      - "Savings opportunities"
      - "Compliance risks"
      - "Lifecycle plan"
    checks:
      - "Savings consider contract terms and notice periods"
      - "End-of-support dates verified"
    eu: []
    examples:
      - "Find savings in our 40 SaaS subscriptions."

  - id: cloud-cost-review
    title: Cloud Cost Review
    summary: Analyses cloud bills to find waste and savings such as idle resources, rightsizing, commitments and storage tiers.
    triggers: the user wants to reduce Azure, AWS or Google Cloud costs, understand a cloud bill or set up FinOps
    use:
      - "Cost spikes"
      - "Budget planning"
    avoid: []
    inputs:
      - "Cost export by service and resource"
      - "Utilisation metrics"
      - "Environments and tags"
    steps:
      - Break down cost by service, environment and owner.
      - Find idle and oversized resources.
      - Assess reservations or savings plans.
      - Propose tagging, budgets and alerts.
    output:
      - "Cost breakdown"
      - "Savings opportunities with estimates"
      - "Governance recommendations"
    checks:
      - "Savings are estimates with assumptions"
      - "Production risk of changes noted"
    eu: []
    examples:
      - "Our Azure bill went up 40 percent. Find out why from this export."

  - id: project-status-report
    title: IT Project Status Report
    summary: Writes a concise project status report with RAG status, progress, risks, issues, decisions needed and next steps.
    triggers: the user needs a project status update, steering committee report or weekly project report
    use:
      - "Weekly or monthly project reporting"
    avoid: []
    inputs:
      - "Plan and milestones"
      - "Progress since last report"
      - "Risks and issues"
      - "Budget status"
    steps:
      - Set overall and dimension RAG status (scope, time, cost, quality) with reasons.
      - Summarise progress against milestones.
      - Update risks and issues with owners.
      - State decisions needed from the steering group.
    output:
      - "Status summary"
      - "RAG table"
      - "Milestones"
      - "Risks and issues"
      - "Decisions needed"
      - "Next steps"
    checks:
      - "RAG status matches the facts"
      - "Decisions are explicit"
    eu: []
    examples:
      - "Write the steering committee update for our ERP migration."

  - id: requirements-user-stories
    title: Requirements and User Stories
    summary: Turns business needs into clear requirements, user stories with acceptance criteria and non-functional requirements.
    triggers: the user needs requirements, a backlog, user stories, acceptance criteria or a functional specification
    use:
      - "New systems or features"
      - "Vendor briefs"
    avoid: []
    inputs:
      - "Business goal and users"
      - "Current process"
      - "Constraints"
    steps:
      - Identify user roles and goals.
      - Write user stories in the as a, I want, so that format.
      - Add testable acceptance criteria.
      - Add non-functional requirements (security, privacy, accessibility, performance).
      - Prioritise the backlog.
    output:
      - "Roles"
      - "User stories with acceptance criteria"
      - "Non-functional requirements"
      - "Prioritised backlog"
    checks:
      - "Stories are small and testable"
      - "Privacy by design is included"
    eu: []
    examples:
      - "Write user stories for an internal holiday request app."

  - id: data-request-sql
    title: Data Request and SQL Helper
    summary: Turns a business data question into a clear data request and a commented SQL query, and explains the results and caveats.
    triggers: the user needs a SQL query, a report from a database, or help translating a business question into data logic
    use:
      - "Ad hoc reporting"
      - "Learning SQL"
    avoid:
      - "Running queries on production without approval"
    inputs:
      - "Business question"
      - "Table and column names"
      - "Database type"
    steps:
      - Clarify the metric definition and filters.
      - Write a commented, read-only query.
      - Explain assumptions and how to check the result.
      - Suggest performance or privacy improvements.
    output:
      - "Metric definition"
      - "SQL query"
      - "Explanation"
      - "Validation checks"
    checks:
      - "Query is read-only"
      - "Personal data is minimised in results"
    eu: []
    examples:
      - "Write SQL to get monthly active customers by country from our orders table in PostgreSQL."

  - id: ai-use-case-intake
    title: AI Use Case Intake and Register
    summary: Captures new AI use cases in a register, screens them for AI Act, GDPR and security risk, and routes them for approval.
    triggers: someone wants to use or build an AI tool, the user needs an AI register, AI inventory or AI approval process
    use:
      - "Employees request AI tools"
      - "Building AI governance"
    avoid:
      - "Detailed legal classification (use legal-ai-act-classification)"
    inputs:
      - "Use case description"
      - "AI tool and vendor"
      - "Data used and people affected"
    steps:
      - Record the use case in a standard register format.
      - Screen for prohibited and high-risk indicators, transparency duties and personal data.
      - Assign an initial risk tier and required reviews (DPIA, security, legal).
      - Define conditions of use and monitoring.
    output:
      - "Register entry"
      - "Risk screening"
      - "Required reviews"
      - "Conditions of use"
      - "Decision log"
    checks:
      - "Owner named for every use case"
      - "Shadow AI tools surfaced"
    eu: ["AI Act Article 4 (AI literacy) applies to all deployers; keeping an inventory of AI systems supports compliance and accountability."]
    examples:
      - "Marketing wants to use an AI image generator. Run it through our AI intake."

  - id: end-user-guide
    title: End-User Guide and Training
    summary: Writes simple end-user guides, quick reference cards and short training plans for new systems or changes.
    triggers: the user needs a user guide, quick start, training material or change communication for staff
    use:
      - "New system roll-outs"
      - "Process changes"
    avoid: []
    inputs:
      - "System and tasks users perform"
      - "User groups and skill levels"
      - "Go-live date"
    steps:
      - List top tasks per user group.
      - Write step-by-step guides with screenshots to add.
      - Create a one-page quick reference.
      - Plan short training sessions and a support channel.
    output:
      - "User guide"
      - "Quick reference"
      - "Training plan"
      - "Launch communication"
    checks:
      - "Written for the least technical user"
      - "Accessible formatting"
    eu: []
    examples:
      - "Write a staff guide for our new expense app, launching on 1 February."
