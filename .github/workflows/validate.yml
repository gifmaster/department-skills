name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Lint catalogue
        run: python scripts/lint_catalogue.py
      - name: Build
        run: python scripts/build.py
      - name: Validate
        run: python scripts/validate.py
      - name: Package
        run: python scripts/package.py
      - name: Generated files are up to date
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || (echo "Run the build and package scripts and commit the result" && exit 1)
